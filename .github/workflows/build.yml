name: Build MacroWalPad

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepara file e Compila
        run: |
          git config --global --add safe.directory '*'
          qmk config user.qmk_home=$(pwd)

          # 1. Patch compatibilità Python 3.14
          sed -i 's/ast\.Num/ast.Constant/g' lib/python/qmk/math.py
          sed -i 's/node\.n/node.value/g' lib/python/qmk/math.py

          # 2. Rinomina cartella in minuscolo
          if [ -d "keyboards/handwired/MacroWalPad" ]; then
            mv keyboards/handwired/MacroWalPad keyboards/handwired/macrowalpad
          fi

          # 3. rules.mk hardware
          cat << 'EOF' > keyboards/handwired/macrowalpad/rules.mk
          MCU = RP2040
          BOOTLOADER = rp2040
          BOARD = GENERIC_RP_RP2040
          LTO_ENABLE = yes
          EOF

          # 4. info.json (layout 2x4 in alto, 4x4 in basso)
          cat << 'EOF' > keyboards/handwired/macrowalpad/info.json
          {
              "keyboard_name": "MacroWalPad",
              "manufacturer": "Wal",
              "processor": "RP2040",
              "bootloader": "rp2040",
              "layouts": {
                  "LAYOUT": {
                      "layout": [
                          {"matrix": [4, 0], "x": 0, "y": 0},
                          {"matrix": [4, 1], "x": 1, "y": 0},
                          {"matrix": [4, 2], "x": 2, "y": 0},
                          {"matrix": [4, 3], "x": 3, "y": 0},

                          {"matrix": [5, 0], "x": 0, "y": 1},
                          {"matrix": [5, 1], "x": 1, "y": 1},
                          {"matrix": [5, 2], "x": 2, "y": 1},
                          {"matrix": [5, 3], "x": 3, "y": 1},

                          {"matrix": [0, 0], "x": 0, "y": 2.5},
                          {"matrix": [0, 1], "x": 1, "y": 2.5},
                          {"matrix": [0, 2], "x": 2, "y": 2.5},
                          {"matrix": [0, 3], "x": 3, "y": 2.5},

                          {"matrix": [1, 0], "x": 0, "y": 3.5},
                          {"matrix": [1, 1], "x": 1, "y": 3.5},
                          {"matrix": [1, 2], "x": 2, "y": 3.5},
                          {"matrix": [1, 3], "x": 3, "y": 3.5},

                          {"matrix": [2, 0], "x": 0, "y": 4.5},
                          {"matrix": [2, 1], "x": 1, "y": 4.5},
                          {"matrix": [2, 2], "x": 2, "y": 4.5},
                          {"matrix": [2, 3], "x": 3, "y": 4.5},

                          {"matrix": [3, 0], "x": 0, "y": 5.5},
                          {"matrix": [3, 1], "x": 1, "y": 5.5},
                          {"matrix": [3, 2], "x": 2, "y": 5.5},
                          {"matrix": [3, 3], "x": 3, "y": 5.5}
                      ]
                  }
              }
          }
          EOF

          # 5. config.h: AUMENTO MACRO E SPAZIO MEMORIA
          cat << 'EOF' > keyboards/handwired/macrowalpad/config.h
          #pragma once

          #define MATRIX_ROWS 6
          #define MATRIX_COLS 4
          #define MATRIX_ROW_PINS { GP5, GP4, GP3, GP2, GP6, GP7 }
          #define MATRIX_COL_PINS { GP10, GP11, GP9, GP8 }
          #define DIODE_DIRECTION COL2ROW

          #define VENDOR_ID       0xFEED
          #define PRODUCT_ID      0x6060
          #define DEVICE_VER      0x0001
          #define MANUFACTURER    "Wal"
          #define PRODUCT         "MacroWalPad"

          /* ESPANSIONE MACRO VIAL */
          #define DYNAMIC_KEYMAP_MACRO_COUNT 64
          #define DYNAMIC_KEYMAP_MACRO_EEPROM_SIZE 3072
          EOF

          # 6. Cartella keymaps/vial
          mkdir -p keyboards/handwired/macrowalpad/keymaps/vial
          printf "VIA_ENABLE = yes\nVIAL_ENABLE = yes\n" > keyboards/handwired/macrowalpad/keymaps/vial/rules.mk

          cat << 'EOF' > keyboards/handwired/macrowalpad/keymaps/vial/config.h
          #pragma once
          #include_next <config.h>

          #define VIAL_KEYBOARD_UID {0x4D, 0x57, 0x8A, 0x21, 0x9C, 0xE3, 0x7B, 0x14}
          #define VIAL_UNLOCK_COMBO_ROWS { 0, 0 }
          #define VIAL_UNLOCK_COMBO_COLS { 0, 1 }
          EOF

          # 7. vial.json
          cat << 'EOF' > keyboards/handwired/macrowalpad/keymaps/vial/vial.json
          {
            "name": "MacroWalPad",
            "lighting": "none",
            "matrix": {
              "rows": 6,
              "cols": 4
            },
            "layouts": {
              "keymap": [
                [
                  "4,0", "4,1", "4,2", "4,3"
                ],
                [
                  "5,0", "5,1", "5,2", "5,3"
                ],
                [
                  {"y": 0.5},
                  "0,0", "0,1", "0,2", "0,3"
                ],
                [
                  "1,0", "1,1", "1,2", "1,3"
                ],
                [
                  "2,0", "2,1", "2,2", "2,3"
                ],
                [
                  "3,0", "3,1", "3,2", "3,3"
                ]
              ]
            }
          }
          EOF

          # 8. Compilazione
          make handwired/macrowalpad:vial

      - name: Salva UF2
        uses: actions/upload-artifact@v4
        with:
          name: macrowalpad_firmware
          path: |
            *.uf2
            .build/*.uf2
            **/*.uf2
